name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:  # release.yml runs these checks before publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The supported floor and the latest LTS
        node-version: [22, 24]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome ci .

      - name: Typecheck (src, tests, examples, spec conformance)
        run: pnpm typecheck

      # Offline only: the transport is mocked, nothing reaches the API (the live suite never runs in CI)
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
