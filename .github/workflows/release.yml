name: Release

on:
  push:
    branches:
      - main

# Not `${{ github.workflow }}-${{ github.ref }}`: the reused ci.yml evaluates its own group
# with the caller's name, and the same group would deadlock
concurrency: publish-${{ github.ref }}

jobs:
  # The same gates as pull requests, so nothing unverified is published
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # npm 11 (Node 24) for trusted publishing/provenance; ci.yml tests the Node 22 floor
          node-version: 24
          cache: 'pnpm'
          # changesets/action v2 no longer writes .npmrc from NPM_TOKEN
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  id-token: write
  contents: write
  pull-requests: write
